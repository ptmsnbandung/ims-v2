version: '3.8'

services:
  # =========================================================================
  # 1. DATABASE INTERNAL N8N (PostgreSQL 16)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kantor_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kantor_ai_net

  # =========================================================================
  # 2. N8N AUTOMATION ENGINE (Orkestrator Kantor AI)
  # =========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: kantor_ai_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Database Backend
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_secure_db_pass_2026}
      
      # Encryption Key for Credentials
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-generate_your_random_32char_key_here}
      
      # Webhook & URL Settings
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      
      # Timezone & Regional Settings
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      
      # Execution & Concurrency
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168 # 7 days
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    extra_hosts:
      - "host.docker.internal:host-gateway" # Mengizinkan n8n mengakses MySQL di server host
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kantor_ai_net

  # =========================================================================
  # 3. CLOUDFLARE TUNNEL (Akses Publik Aman & Webhook Tanpa IP Publik)
  # =========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kantor_ai_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n
    networks:
      - kantor_ai_net

networks:
  kantor_ai_net:
    driver: bridge

volumes:
  postgres_data:
    name: kantor_ai_postgres_data
  n8n_data:
    name: kantor_ai_n8n_data
